<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; background:#0e1c1d; color:#f1e9d8; font-family:'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:#2fa7ab; } a:hover { color:#e8912b; }
    .screen { width:390px; height:844px; overflow:hidden; background:#0e1c1d; display:flex; flex-direction:column; position:relative; }
    .serif { font-family:'DM Serif Display', Georgia, 'Times New Roman', serif; font-weight:400; }
    .mono { font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .cap { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:#93aaa8; }
    .hair { height:1px; background:#2a4a4b; }
    .btn { display:flex; align-items:center; justify-content:center; min-height:48px; border-radius:10px; border:1px solid #2a4a4b; background:#152a2b; color:#f1e9d8; font-size:16px; font-weight:700; }
    .btn-primary { background:#2fa7ab; border-color:#2fa7ab; color:#08191a; }
    .btn-orange { background:#e8912b; border-color:#e8912b; color:#1a1206; }
    .field { display:flex; align-items:center; gap:10px; min-height:56px; padding:0 14px; border:1px solid #2a4a4b; border-radius:10px; background:#152a2b; }
    .field .lab { flex:1 1 auto; font-size:15px; color:#93aaa8; }
    .field .val { font-size:22px; color:#f1e9d8; min-width:88px; text-align:right; }
    .unit { display:flex; align-items:center; gap:6px; min-height:36px; padding:0 10px; border-radius:8px; border:1px solid #2a4a4b; background:#1b3435; font-size:14px; font-weight:700; color:#f1e9d8; }
    .tile { display:flex; flex-direction:column; justify-content:space-between; min-height:124px; padding:14px; border:1px solid #2a4a4b; border-radius:12px; background:#152a2b; }
    .tile .name { font-size:19px; font-weight:700; color:#f1e9d8; }
    .tile .sub { font-size:12px; color:#93aaa8; margin-top:2px; }
    .tile .idx { font-size:11px; color:#e8912b; }
    .chip { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 12px; border-radius:20px; border:1px solid #2a4a4b; background:#1b3435; font-size:14px; font-weight:700; color:#f1e9d8; }
    .ico { width:22px; height:22px; stroke:#2fa7ab; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    </style>
</helmet>

<div class="screen">
  
<div style="display:flex; align-items:center; gap:12px; padding:58px 20px 12px 16px;">
  <div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;border:1px solid #2a4a4b"><svg class="ico" viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M15 5 l-7 7 7 7"></path></svg></div>
  <div style="flex:1 1 auto; display:flex; align-items:baseline; gap:10px;">
    <span class="serif" style="font-size:26px; color:#f1e9d8">Lipo 3000</span>
  </div>
  <div class="chip" style="min-height:36px; border-color:#2fa7ab">6 wells</div>
</div>
<div class="hair" style="margin:0 16px"></div>
  <div style="padding:14px 16px 0 16px;">
    <div style="display:flex; gap:4px;"><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2fa7ab"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2fa7ab"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2fa7ab"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2fa7ab"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#e8912b"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2a4a4b"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2a4a4b"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2a4a4b"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2a4a4b"></div><div style="flex:1 1 0; height:4px; border-radius:2px; background:#2a4a4b"></div></div>
    <div style="display:flex; justify-content:space-between; margin-top:8px;" class="mono">
      <span style="font-size:12px; color:#93aaa8">step 5 of 10</span>
      <span style="font-size:12px; color:#93aaa8">24-well</span>
    </div>
  </div>
  <div style="padding:22px 20px 0 20px; flex:1 1 auto;">
    <div class="serif" style="font-size:34px; line-height:1.1; color:#f1e9d8">Mix B: Opti-MEM + DNA + P3000</div>
    <div style="margin-top:12px; font-size:18px; line-height:1.45; color:#f1e9d8">Add P3000 last.</div>
    <div style="margin-top:18px; padding:12px 14px; border-radius:12px; background:#152a2b; border:1px solid #2a4a4b">
      <div style="display:flex; justify-content:space-between;" class="cap"><span>Master mix</span><span style="color:#e8912b">6 wells + 10 %</span></div>
      <div style="margin-top:4px;">
      <div style="display:flex; align-items:center; min-height:44px; gap:8px;">
        <span style="flex:1 1 auto; font-size:15px">Opti-MEM</span>
        <span class="mono" style="width:70px; text-align:right; font-size:14px; color:#93aaa8">25 µL</span>
        <span class="mono" style="width:78px; text-align:right; font-size:17px; color:#e8912b">165 µL</span>
      </div><div class="hair"></div>
      <div style="display:flex; align-items:center; min-height:44px; gap:8px;">
        <span style="flex:1 1 auto; font-size:15px">DNA</span>
        <span class="mono" style="width:70px; text-align:right; font-size:14px; color:#93aaa8">500 ng</span>
        <span class="mono" style="width:78px; text-align:right; font-size:17px; color:#e8912b">3.3 µg</span>
      </div><div class="hair"></div>
      <div style="display:flex; align-items:center; min-height:44px; gap:8px;">
        <span style="flex:1 1 auto; font-size:15px">P3000 Reagent</span>
        <span class="mono" style="width:70px; text-align:right; font-size:14px; color:#93aaa8">1 µL</span>
        <span class="mono" style="width:78px; text-align:right; font-size:17px; color:#e8912b">6.6 µL</span>
      </div><div class="hair"></div></div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:10px; min-height:44px;">
        <span class="cap" style="flex:0 0 auto">Plasmid</span>
        <span class="mono" style="flex:1 1 auto; font-size:15px; color:#2fa7ab; border-bottom:1px dashed #2fa7ab; padding-bottom:2px">pNF-κB-luc + pRL-TK</span>
      </div>
    </div>
    <div style="margin-top:14px; padding:12px 14px; border-radius:12px; background:#1b3435; border:1px solid #2a4a4b; font-size:14px; color:#93aaa8">Mix well. No need to vortex.</div>
  </div>
  <div style="padding:0 16px 24px 16px; display:flex; gap:10px;">
    <div class="btn" style="flex:1 1 0; min-height:60px; font-size:17px">Back</div>
    <div class="btn btn-primary" style="flex:2 1 0; min-height:60px; font-size:17px">Next: Combine</div>
  </div>
</div>
</x-dc>
</body>
</html>
